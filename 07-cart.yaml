- name: configure cart server
  hosts: cart
  become: true
  tasks:
  - name: disable default nodejs
    command: dnf module disable nodejs -y

  - name: enable nodejs24
    command: dnf module enable nodejs:24 -y

  - name: install nodejs
    dnf:
      name: nodejs
      state: present

  - name: create roboshop system cart
    cart:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin
      comment: "roboshop system cart"

  - name: remove existing app directory
    file:
      path: /app
      state: absent

  - name: remove cart.zip
    file:
      path: /tmp/cart.zip
      state: absent

  - name: create app directory
    file:
      path: /app
      state: directory

  - name: download cart application
    get_url:
      url: https://raw.githubcartcontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/cart-{{ app_version}}.zip
      dest: /tmp/cart.zip

  - name: unzip cart
    unarchive:
       src: /tmp/cart.zip
       dest: /app
       remote_src: yes

  - name: install dependencies
    community.general.npm:
       path: /app

  - name: copy cart service
    template:
      src: cart.service.j2
      dest: /etc/systemd/system/cart.service

  - name: copy mongo repo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo


  - name: install mongodb client
    dnf:
      name: mongodb-mongosh
      state: present


  - name: check products loaded or not
    command: mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("cart").products.countDocuments()'
    register: product_count

  - name: print product_count
    debug:
      msg: "{{ product_count }}"

  - name: print  product_count
    debug:
      msg: "{{ product_count }}"

  - name: load the products
    shell: mongosh --host "{{ mongodb_host }}" </app/db/master-data.js
    when: product_count.stdout | int == 0


  - name: daemon reload
    system_service:
      daemon_reload: true

  - name: start and enable cart
    service:
      state: restarted
      enabled: yes